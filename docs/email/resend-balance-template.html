<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>{{{TITLE}}}</title>
  </head>
  <body style="margin:0;padding:0;background:#FDFDFB;">
    <!-- Hidden preheader: improves inbox preview text without affecting rendering. -->
    <div
      style="display:none;font-size:1px;color:#FDFDFB;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;"
    >
      {{{PREHEADER}}}
    </div>

    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#FDFDFB;">
      <tr>
        <td align="center" style="padding:28px 12px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;max-width:600px;">
            <tr>
              <td style="padding:0 8px 14px;">
                <div style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                    <tr>
                      <td align="left" style="font-weight:900;letter-spacing:0.08em;color:#0f172a;">
                        BALANCE
                      </td>
                      <td align="right" style="font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#64748b;">
                        Attendance and leave
                      </td>
                    </tr>
                  </table>
                </div>
              </td>
            </tr>

            <tr>
              <td style="background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:22px 20px;">
                <div style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;">
                  <h1 style="margin:0 0 12px;font-size:18px;line-height:26px;color:#0f172a;">
                    {{{TITLE}}}
                  </h1>

                  <!-- Optional greeting block (pre-rendered HTML). -->
                  {{{GREETING_HTML}}}

                  <div style="font-size:14px;line-height:22px;color:#0f172a;">
                    <!-- bodyHtml should be trusted HTML (or pre-escaped) -->
                    {{{BODY_HTML}}}
                  </div>

                  <!-- Optional CTA block (pre-rendered HTML). -->
                  {{{CTA_HTML}}}
                </div>
              </td>
            </tr>

            <tr>
              <td style="padding:14px 12px 0;">
                <div style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:12px;line-height:18px;color:#64748b;">
                  {{{FOOTER_NOTE}}}
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
